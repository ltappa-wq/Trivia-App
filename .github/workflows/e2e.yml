name: E2E

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - name: Start isolated Supabase and apply repository migrations
        run: |
          supabase start
          supabase db reset --local --no-seed
      - name: Mixed-mode SQL behavior and legacy regression
        run: |
          for fixture in supabase/tests/0019_game_options.sql supabase/tests/0023_tv_display.sql supabase/tests/0024_mixed_mode.sql supabase/tests/0025_family_friendly.sql; do
            docker exec -i supabase_db_buzzr-e2e psql -U postgres -v ON_ERROR_STOP=1 < "$fixture"
          done
      - name: Export local-only credentials
        shell: bash
        run: |
          supabase status -o env > "$RUNNER_TEMP/supabase.env"
          source "$RUNNER_TEMP/supabase.env"
          echo "::add-mask::$SERVICE_ROLE_KEY"
          echo "::add-mask::$ANON_KEY"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"
      - name: Verify local generation schema and lease write
        run: node scripts/e2e-preflight.mjs
      - run: npx playwright install --with-deps chromium
      - name: Deterministic multiplayer and accessibility E2E
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-traces
          path: test-results/
          retention-days: 7
      - name: Stop isolated Supabase
        if: always()
        run: supabase stop --no-backup
